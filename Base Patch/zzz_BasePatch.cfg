// Update tank types

@PART:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]]:FINAL {
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]] {

        // Duplicate existing tank types in correct order and add hypergolic type

        +SUBTYPE[LF/O] {
            @name = reorder:LF/O
            @title = Kerolox
            @tankType = Kerolox
        } +SUBTYPE[LH2/O] {
            @name = reorder:LH2/O
            @title = Hydrolox
            @tankType = Hydrolox
        } +SUBTYPE[Methalox] {
            @name = reorder:Methalox
            @title = Methalox
            @tankType = Methalox
        } +SUBTYPE[LF/O] { // no previously defined reference, so this is the next best solution
			@name = reorder:Hypergolic
			@title = Hypergolic
			@tankType = Hypergolic
		} +SUBTYPE[LiquidFuel] {
            @name = reorder:LiquidFuel
            @title = Kerosine
            @tankType = Kerosine
        } +SUBTYPE[LH2] {
            @name = reorder:LH2
            @title = Hydrogen
            @tankType = Hydrogen
        } +SUBTYPE[Methane] {
            @name = reorder:Methane
            @title = Methane
            @tankType = Methane
        } +SUBTYPE[LiquidFuel] { // see above
            @name = reorder:Aerozine50/50
			@title = Aerozine50/50
			@tankType = Aerozine50/50
        } +SUBTYPE[Oxidizer] {
            @name = reorder:Oxidizer
            @title = Oxygen
            @tankType = Oxygen
        } +SUBTYPE[Oxidizer] { // see above
            @name = reorder:Nitrogen Tetroxide
			@title = Nitrogen Tetroxide
			@tankType = Nitrogen Tetroxide
        }

        // Remove old types

		-SUBTYPE[LF/O] {}
		-SUBTYPE[LH2/O] {}
		-SUBTYPE[LH2] {}
		-SUBTYPE[Methane] {}
		-SUBTYPE[Methalox] {}
		-SUBTYPE[Oxidizer] {}
		-SUBTYPE[LiquidFuel] {}

        // Rename reordered fuels

        @SUBTYPE[reorder:LF/O] {
            @name = Kerolox
        } @SUBTYPE[reorder:LH2/O] {
            @name = Hydrolox
        } @SUBTYPE[reorder:Methalox] {
            @name = Methalox
        } @SUBTYPE[reorder:Hypergolic] {
            @name = Hypergolic
        } @SUBTYPE[reorder:LiquidFuel] {
            @name = Kerosine
        } @SUBTYPE[reorder:LH2] {
            @name = Hydrogen
        } @SUBTYPE[reorder:Methane] {
            @name = Methane
        } @SUBTYPE[reorder:Aerozine50/50] {
            @name = Aerozine50/50
        } @SUBTYPE[reorder:Oxidizer] {
            @name = Oxygen
        } @SUBTYPE[reorder:Nitrogen?Tetroxide] {
            @name = Nitrogen Tetroxide
        }
    }

    // Reset boiloff

    !MODULE[ModuleCryoTank] {}
	MODULE {
		name = ModuleCryoTank
		CoolingEnabled = False

		BOILOFFCONFIG {
			FuelName = Liquid Hydrogen
			BoiloffRate = 0.05
			CoolingCost = 0.09
		} BOILOFFCONFIG {
			FuelName = Liquid Methane
			BoiloffRate = 0.005
			CoolingCost = 0.045
		} BOILOFFCONFIG {
			FuelName = Liquid Oxygen
			BoiloffRate = 0.02
			CoolingCost = 0.04
		}
	}
}

@PART:HAS[@RESOURCE[MonoPropellant]]:FINAL {
	@RESOURCE[MonoPropellant] {
		@name = Hydrazine
	}
}