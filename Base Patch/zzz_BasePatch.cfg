// Create denser fuel

+RESOURCE_DEFINITION[LiquidFuel]:FINAL
{
	@name = Liquid Kerosine
	@displayName = Liquid Kerosine
	@abbreviation = RP-1(l)
	@density = 0.02
	@unitCost *= 0.2
}

+RESOURCE_DEFINITION[LqdHydrogen]:FINAL
{
	@name = Liquid Hydrogen
	@displayName = Liquid Hydrogen
	@abbreviation = H2(l)
	@density = 0.002
}

+RESOURCE_DEFINITION[LqdMethane]:FINAL
{
	@name = Liquid Methane
	@displayName = Liquid Methane
	@abbreviation = CH4(l)
	@density = 0.01
}

+RESOURCE_DEFINITION[Aerozine50]:FINAL
{
	@name = Liquid Aerozine50/50
	@displayName = Liquid Aerozine50/50
	@abbreviation = AZ50(l)
	@density = 0.022
}

+RESOURCE_DEFINITION[Oxidizer]:FINAL
{
	@name = Liquid Oxygen
	@displayName = Liquid Oxygen
	@abbreviation = O2(l)
	@density = 0.02
	@unitCost *= 0.2
}

+RESOURCE_DEFINITION[NTO]:FINAL
{
	@name = Liquid Dinitrogen Tetroxide
	@displayName = Liquid Dinitrogen Tetroxide
	@abbreviation = N2O4(l)
	@density = 0.022
}

+RESOURCE_DEFINITION[MonoPropellant]:FINAL
{
	@name = Hydrazine
	@displayName = Hydrazine
	@abbreviation = N2H4(l)
	@density = 0.015
}

