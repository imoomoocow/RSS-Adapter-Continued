@PART[nflv-engine-rd704-1]:AFTER[NearFutureLaunchVehicles] // RD-704 (Lynx)
{
	@title = RD-704
	@mass = 2.42
    @MODULE[ModuleEngines*]
    {
    	@maxThrust = 1720.1 // 1050
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdHydrogen
			@ratio = 1,5
		}
		@PROPELLANT[Oxidizer]
		{
			@ratio = 0,1
		}
    	@atmosphereCurve
		{
			@key,0 = 0 407
			@key,1 = 1 356
		}

	}
}

