// Adds AZ50 for RCS

// ****************** Stock ********************** \\

@PART[RCSblock_01_small,restock-rcs-block-multi-mini-2,RCSBlock_v2,restock-rcs-block-multi-2,RCSLinearSmall,linearRcs]:FINAL
{
	%IspASL = #$MODULE[ModuleRCSFX]/atmosphereCurve/key,1[1, ]$
	%Thrust = #$/MODULE[ModuleRCSFX]/thrusterPower$


	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = RCS
		//switcherDescription = #LOC_NFLaunchVehicles_switcher_rcs_desc
		//switcherDescriptionPlural =  #LOC_NFLaunchVehicles_switcher_rcs_desc_plural
		switchInFlight = True

		SUBTYPE
		{
			name = Hydrazine
			title = Hydrazine
			primaryColor = #ffffff
			secondaryColor = #ffffff
			descriptionDetail = IspVac = 270

			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/Thrust$
					PROPELLANT
						{
							name = Hydrazine
							ratio = 1
							resourceFlowMode = STAGE_PRIORITY_FLOW
						}
          
						atmosphereCurve
						{
							key = 0 270
							key = #1 $/IspASL$
							key = 4 0.001
						}
				}
			}
		}

		SUBTYPE
		{
			name = Hypergolic
			title = Hypergolic
			primaryColor = #ba9941
			secondaryColor = #c3d63d
			descriptionDetail = IspVac = 220
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = #$/Thrust$
					PROPELLANT
					{
						name = Liquid Aerozine50/50
						ratio = 0.45
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					PROPELLANT
					{
						name = Liquid Dinitrogen Tetroxide
						ratio = 0.55
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = 0 220
						key = #1 $/IspASL$
						key = 4 0.001
					}
				}
			}
		}
	}
}



