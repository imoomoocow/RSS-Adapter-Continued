@PART[mk1pod_v2|kv1Pod|kv2Pod|kv3Pod|Mk2Pod]
{
	!RESOURCE[MonoPropellant]	{}
	
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		baseVolume = 5
		
		SUBTYPE {
			name = Hydrazine
			tankType = Hydrazine
		} SUBTYPE {
			name = Hypergolic
			tankType = Hypergolic
		}
	}
}

@PART[landerCabinSmall]
{
	!RESOURCE[MonoPropellant]	{}
	
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		baseVolume = 15
		
		SUBTYPE {
			name = Hypergolic
			tankType = Hypergolic
		}
	}
}

@PART[MEMLander] // Munar Excursion Module (M.E.M.)
{

	@MODULE[ModuleRCSFX]
	{
		PROPELLANT {
			name = Liquid Aerozine50/50
			ratio = 0.45
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = Liquid Dinitrogen Tetroxide
			ratio = 0.55
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
	}

	!RESOURCE[MonoPropellant]{}
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		baseVolume = 100
		
		SUBTYPE {
			name = Hypergolic
			tankType = Hypergolic
		}
	}
}

