// The engineSwitch subtypes above target ModuleEnginesFX, which is what ReStock turns these engines
// into. Stock KSP gives the Bobcat and the Poodle v2 a plain ModuleEngines, so without ReStock B9 throws
// "Could not find matching module". Point the subtypes at ModuleEngines in that case.
@PART[LiquidEngineLV-TX87,liquidEngine2-2_v2]:HAS[@MODULE[ModuleEngines]]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
	{
		@SUBTYPE,*
		{
			@MODULE,*
			{
				@IDENTIFIER:HAS[#name[ModuleEnginesFX]]
				{
					@name = ModuleEngines
				}
			}
		}
	}
}

