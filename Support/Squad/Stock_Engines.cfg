@PART[LiquidEngineLV-TX87] // LR87 (LV-TX87 "Bobcat")
{
	%real_title = LR87
	%real_description = The LR87 design was found to be reslient enough to be be adapted not only to corrosive storable propellants, but also difficult to handle cryogenics. The LR87 to this day remains the only engine to have been succesfully test fired with Kerolox, Hypergolic and Cryogenic fuels.
	@TechRequired = advRocketry
	@mass = 0.758
	
	@MODULE[ModuleEngine*]
	{
		@maxThrust = 1482
		@atmosphereCurve
		{
			@key,0 = 0 290
			@key,1 = 1 256
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = engineSwitch
		switcherDescription = Engine Config
		switcherDescriptionPlural = Engine Configs
		affectDragCubes = False
		affectFARVoxels = False

		SUBTYPE
		{
			name = LR87-3
			title = LR87-3
			descriptionSummary = Powerful 1.875m engine for the Titan I ICBM first stage.
			descriptionDetail = <b>Propellant - KeroLox</b> \n<b>Thrust:</b> 1308 kN ASL / 1482 kN Vac.\n<b>Isp:</b> 256 s ASL / 290 s Vac.
			defaultSubtypePriority = 0
			primaryColor	= #dfc780
			secondaryColor = #44b7ea
		}
		
		SUBTYPE
		{
			name = LR87-11
			title = LR87-11
			descriptionSummary = Powerful 1.875m engine for the Titan-II first stage.
			descriptionDetail = <b>Propellant - Aerozine50 + NTO</b> \n<b>Thrust:</b> 1742 kN ASL / 2157 kN Vac.\n<b>Isp:</b> 252 s ASL / 312 s Vac.
			defaultSubtypePriority = 2
			addedCost = 2798
			primaryColor	= #ba9941
			secondaryColor = #c3d63d
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
				}

				DATA
				{
					maxThrust = 2157

					PROPELLANT
					{
						name = Aerozine50
						ratio = 0.9
						DrawGauge = True
					}
					PROPELLANT
					{
						name = NTO
						ratio = 1.1
					}
					atmosphereCurve
					{
						key = 0 312
						key = 1 252
						key = 6 0.001
					}
				}
			}
		}

		SUBTYPE
		{
			name = LR87-LH2
			title = LR87-LH2
			descriptionSummary = The Lox/LH2 version was the first large Lox/LH2 engine fired in the world.
			descriptionDetail = <b>Propellant - LqdHydrogen + LqdOxygen</b> \n<b>Thrust:</b> 1148.6 kN ASL / 1315 kN Vac.\n<b>Isp:</b> 359 s ASL / 411 s Vac.
			defaultSubtypePriority = -1
			primaryColor	= #b9ecff
			secondaryColor = #44b7ea

			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
				}

				DATA
				{
					maxThrust = 1315

					PROPELLANT
					{
						name = LqdHydrogen
						ratio = 15
						DrawGauge = True
					}
					PROPELLANT
					{
						name = Oxidizer
						ratio = 1
					}
					atmosphereCurve
					{
						key = 0 411
						key = 1 359
						key = 3 0.001
					}
				}
			}
		}
	}
}

//waterfall configs
@PART[LiquidEngineLV-TX87]:NEEDS[Waterfall,ReStock]:AFTER[000_ReStock]
{
	!MODULE[ModuleWaterfallFX] {}
	!MODULE[EngineLightEffect] {}
	!EFFECTS {}
	EFFECTS
	{
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = Waterfall/Sounds/KW/sound_liq1
				volume = 1.0
				pitch = 1.0
				loop = false
			}
		}
		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = Waterfall/Sounds/KatSounds/kero_flameout_hard
				volume = 1.0
				pitch = 1.0
				loop = false
			}
		}
		fx-bobcat-running
		{
			AUDIO
			{
				channel = Ship
				clip = Waterfall/Sounds/KatSounds/kero_loop_hard
				volume = 0.0 0.0
				volume = 0.05 0.6
				volume = 1.0 1.0
				pitch = 0.0 0.7
				pitch = 1.0 1.0
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				name = exhaust
				modelName = ReStock/FX/restock-fx-mainsail-turbo-1
				transformName = exhaust_fxTransform
				emission = 0.0 0.0
				emission = 0.01 0.1
				emission = 0.075 0.25
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
			}
			PREFAB_PARTICLE
			{
				prefabName = fx_smokeTrail_light
				transformName = fxTransformPlume
				emission = 0.0 0.0
				emission = 0.05 0.0
				emission = 0.075 0.25
				emission = 1.0 1.25
				speed = 0.0 0.25
				speed = 1.0 1.0
			}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = lr87FX
		engineID = basicEngine
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			range = -1,1
		}
		TEMPLATE
		{
			templateName = waterfall-kerolox-lower-1
			overrideParentTransform = thrustTransform
			position = 0,0,0
			rotation = 0, 0, 0
			scale = 1.6, 1.6, 2
		}
	}
}


