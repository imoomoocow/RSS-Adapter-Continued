@PART[rcsTankMini,monopropMiniSphere,rcsTankRadialLong,radialRCSTank,RCSFuelTank]:FINAL
{
	%Volume = #$RESOURCE[MonoPropellant]/maxAmount$
	
	!RESOURCE[MonoPropellant] {}
	
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		//switcherDescription = #LOC_CryoTanks_switcher_fuel_title
		baseVolume = #$../Volume$
		SUBTYPE
		{
			name = Hydrazine
			tankType = Hydrazine
		}
		
		SUBTYPE
		{
			name = Hypergolic
			title = Hypergolic
			tankType = Hypergolic
			primaryColor = #ba9941
			secondaryColor = #c3d63d
		}
	}
}

@PART[xenonTank,xenonTankLarge,xenonTankRadial]:FINAL // PB-X150 720 -> 2,949; PB-X750 5,700 -> 23,347; PB-X50R 405 -> 1,659
{
	@mass *= 1.6
	@RESOURCE[XenonGas]
	{
		@amount *= 4.096
		@maxAmount *= 4.096
	}
}

@PART[MtmStage]:FINAL // BepiColombo MTM: 581 kg xenon (was 380 kg)
{
	@RESOURCE[XenonGas]
	{
		@amount = 5810
		@maxAmount = 5810
	}
}
